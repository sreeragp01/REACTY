<!DOCTYPE html>
<html lang="en">
<head>

<title>Reacty's React Academy</title>
<link href="https://fonts.googleapis.com/css2?family=Bangers&family=Comic+Neue:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{--ink:#1b1b2f;--bg:#8fd3ff;--paper:#fffdf5;--yellow:#ffd23f;--pink:#ff6b9d;--mint:#4ee0a0;--cyan:#61dafb;--code:#23234a;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#2b3a67;--paper:#2f2f55;--ink:#fff7d6;--code:#14142e}}
:root[data-theme="dark"]{--bg:#2b3a67;--paper:#2f2f55;--ink:#fff7d6;--code:#14142e}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);background-image:radial-gradient(rgba(0,0,0,.12) 2px,transparent 2.5px);background-size:18px 18px;color:var(--ink);font:400 17px/1.5 "Comic Neue","Comic Sans MS",cursive,sans-serif}
h1,h2,h3{font-family:Bangers,Impact,sans-serif;letter-spacing:1px;font-weight:400;margin:0}
.wrap{max-width:900px;margin:0 auto;padding:16px}
header{display:flex;flex-wrap:wrap;align-items:center;gap:12px;justify-content:space-between;margin-bottom:12px}
h1{font-size:clamp(30px,6vw,48px);color:var(--yellow);-webkit-text-stroke:2px #1b1b2f;paint-order:stroke fill;text-shadow:3px 3px 0 #1b1b2f}
.xp{background:var(--paper);border:3px solid var(--ink);border-radius:14px;padding:6px 12px;box-shadow:4px 4px 0 var(--ink);font-weight:700}
.bar{height:12px;width:150px;border:2px solid var(--ink);border-radius:8px;background:var(--paper);overflow:hidden;margin-top:2px}
.bar i{display:block;height:100%;background:var(--mint);width:0;transition:width .4s}
nav{display:flex;gap:8px;overflow-x:auto;padding:6px 4px 12px}
nav button{flex:0 0 auto;width:54px;height:54px;border-radius:50%;border:3px solid var(--ink);background:var(--paper);font-size:24px;cursor:pointer;box-shadow:3px 3px 0 var(--ink);position:relative}
nav button.on{background:var(--yellow);transform:translateY(-3px) rotate(-6deg)}
nav button.done::after{content:"★";position:absolute;right:-6px;top:-10px;font-size:18px;color:var(--pink);-webkit-text-stroke:1px var(--ink)}
button:focus-visible,input:focus-visible,select:focus-visible{outline:4px solid var(--pink);outline-offset:2px}
nav.sub button{width:46px;height:46px;border-radius:12px;font:400 21px Bangers,Impact,sans-serif;color:var(--ink)}nav button.soon{opacity:.6;background:repeating-linear-gradient(45deg,var(--paper),var(--paper) 6px,#d9d9d9 6px,#d9d9d9 12px)}nav button.on.soon{opacity:1}
.panel{background:var(--paper);border:4px solid var(--ink);border-radius:18px;box-shadow:7px 7px 0 var(--ink);padding:18px;margin-bottom:22px}
.hero{display:flex;gap:14px;align-items:center}
.hero svg{flex:0 0 110px;width:110px}
.bubble{position:relative;background:#fff;color:#1b1b2f;border:3px solid #1b1b2f;border-radius:22px;padding:12px 16px;font-weight:700;font-size:19px}
.bubble::before{content:"";position:absolute;left:-14px;top:30px;border:10px solid transparent;border-right:14px solid #1b1b2f;border-left:0}
h2{font-size:clamp(26px,5vw,38px);color:var(--pink);-webkit-text-stroke:1.5px var(--ink);paint-order:stroke fill;margin-bottom:8px}
h3{font-size:24px;margin:0 0 8px}
.story{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(200px,1fr))}
.story div{border:3px solid var(--ink);border-radius:12px;padding:10px 12px;background:var(--yellow);color:#1b1b2f;font-weight:700}
.story div:nth-child(2){background:var(--mint)}.story div:nth-child(3){background:#ffb3d1}
pre{background:var(--code);color:#bff3ff;border:3px solid var(--ink);border-radius:12px;padding:14px;overflow-x:auto;font:14px/1.5 ui-monospace,Menlo,Consolas,monospace;margin:0}
.demo{border:3px dashed var(--ink);border-radius:14px;padding:14px;text-align:center;min-height:110px}
.btn{font:700 17px "Comic Neue","Comic Sans MS",cursive;background:var(--cyan);color:#1b1b2f;border:3px solid var(--ink);border-radius:12px;padding:7px 14px;cursor:pointer;box-shadow:3px 3px 0 var(--ink);margin:4px}
.btn:active{transform:translate(3px,3px);box-shadow:0 0 0 var(--ink)}
.btn.pk{background:var(--pink)}.btn.mn{background:var(--mint)}.btn.yl{background:var(--yellow)}
input,select{font:700 17px "Comic Neue",cursive;border:3px solid var(--ink);border-radius:10px;padding:6px 10px;background:#fff;color:#1b1b2f;max-width:100%}
.card{display:inline-block;background:#fff;color:#1b1b2f;border:3px solid var(--ink);border-radius:12px;padding:8px 14px;margin:5px;font-weight:700;box-shadow:3px 3px 0 var(--ink)}
.big{font-size:44px;font-family:Bangers,Impact,sans-serif}
.opt{display:block;width:100%;text-align:left;margin:8px 0}
.fb{margin-top:10px;font-weight:700;padding:10px;border-radius:10px;border:3px solid var(--ink)}
.ok{background:var(--mint);color:#1b1b2f}.no{background:#ffb3d1;color:#1b1b2f}
.log{text-align:left;font:13px ui-monospace,monospace;background:var(--code);color:#9dffc8;border-radius:8px;padding:8px;margin-top:8px;max-height:110px;overflow:auto}
.row{display:flex;justify-content:space-between;gap:10px;margin-top:6px}
@media(max-width:560px){.hero{flex-direction:column;text-align:center}.bubble::before{display:none}}
@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
@keyframes wob{0%,100%{transform:rotate(-4deg)}50%{transform:rotate(4deg)}}
.wob{animation:wob 2s ease-in-out infinite;transform-origin:50% 80%}
</style>
</head>

function d7(c){c.innerHTML=`<label><input type="checkbox" id="m"> Show the Clock component</label><div class="big" id="s"></div><div class="log" id="l">(nothing yet)</div>`;let iv=null,s=0;const lg=x=>{const l=$("#l");l.innerHTML=(l.textContent==="(nothing yet)"?"":l.innerHTML)+x+"<br>";l.scrollTop=1e9};$("#m").onchange=e=>{if(e.target.checked){s=0;$("#s").textContent="⏱ 0s";lg("✅ effect ran: timer started");iv=setInterval(()=>{s++;$("#s").textContent="⏱ "+s+"s"},1000);timers.push(iv)}else{clearInterval(iv);$("#s").textContent="";lg("🧹 cleanup ran: timer stopped")}}}

function d9(c){const S=["idle","loading","error","success"],E={idle:"😴",loading:"⏳",error:"😱",success:"🥳"};let i=0;const r=()=>{const s=S[i];c.innerHTML=`<div style="font-size:54px">${E[s]}</div><p><b>status = "${s}"</b></p><button class="btn yl" id="a">Next status</button>`;$("#a").onclick=()=>{i=(i+1)%4;r()}};r()}

{t:"What is React?",e:"⚛️",say:"Welcome, future React hero! I'm Reacty. Let's see what React actually is.",s:["React is a JavaScript library for building user interfaces.","You describe how the screen should look, and React keeps it up to date.","It was made at Facebook and is used by huge apps all over the world."],code:`// index.html has <div id="root"></div>

function row(){return `<div class="row"><button class="btn" id="pv" ${cur===0?'disabled style="opacity:.4"':''}>◀ Back</button><button class="btn yl" id="nx" ${cur===P.length-1?'disabled style="opacity:.4"':''}>Next lesson ▶</button></div>`}
function wire(){$("#pv").onclick=()=>{if(cur>0){cur--;show()}};$("#nx").onclick=()=>{if(cur<P.length-1){cur++;show()}}}
function stub(p){$("#stage").innerHTML=`<section class="panel"><div class="hero">${mascot}<div class="bubble">Shhh... I'm still drawing this lesson! ✏️ Try the colorful lessons above, or come back soon.</div></div></section><section class="panel"><span class="card">${W[p.w]}</span><h2>Lesson ${p.i+1}: ${esc(p.t)}</h2><p>🚧 Coming soon. This lesson is on the roadmap.</p></section>`+row();wire();buildNav();window.scrollTo(0,0)}
function buildNav(){const w=P[cur].w,has=t=>L.some(l=>l.t===t);$("#nav").innerHTML=W.map((x,i)=>`<button class="${i===w?'on':''}" data-w="${i}" title="${x}" aria-label="${x}">${x.split(" ")[0]}</button>`).join("");$("#nav2").innerHTML=P.filter(x=>x.w===w).map(x=>`<button class="${x.i===cur?'on':''} ${done.has(x.i)?'done':''} ${has(x.t)?'':'soon'}" data-i="${x.i}" title="${esc(x.t)}" aria-label="Lesson ${x.i+1}: ${esc(x.t)}">${x.i+1}</button>`).join("");document.querySelectorAll("#nav [data-w]").forEach(b=>b.onclick=()=>{cur=+b.dataset.w*10;show()});document.querySelectorAll("#nav2 [data-i]").forEach(b=>b.onclick=()=>{cur=+b.dataset.i;show()});$("#xp").textContent=xp;$("#cnt").textContent=done.size;$("#fill").style.width=done.size/P.length*100+"%"}

function show(){
timers.forEach(clearInterval);timers=[];
const p=P[cur],l=L.find(x=>x.t===p.t);if(!l){stub(p);return}
$("#stage").innerHTML=`
<section class="panel"><div class="hero">${mascot}<div class="bubble">${l.say}</div></div></section>
<section class="panel"><span class="card">${W[p.w]}</span><h2>Lesson ${cur+1}: ${l.t}</h2><div class="story">${l.s.map(x=>`<div>${x}</div>`).join("")}</div></section>
<section class="panel"><h3>📝 The code</h3><pre><code>${esc(l.code)}</code></pre></section>
<section class="panel"><h3>🎮 Try it!</h3><div class="demo" id="demo"></div></section>
<section class="panel"><h3>🎯 Quick quiz</h3><p><b>${l.q[0]}</b></p><div id="qz">${l.q[1].map((o,i)=>`<button class="btn opt" data-i="${i}">${esc(o)}</button>`).join("")}</div><div id="fb" aria-live="polite"></div></section>
`+row();
l.d($("#demo"));
document.querySelectorAll("#qz button").forEach(b=>b.onclick=()=>{
const ok=+b.dataset.i===l.q[2];
if(ok){if(!done.has(cur)){done.add(cur);xp+=10;if(done.size===L.length)xp+=30}
$("#fb").innerHTML=`<div class="fb ok">🎉 Correct! +10 XP. ${l.q[3]}${done.size===L.length?'<br>🏆 You cleared every lesson drawn so far. More are coming!':''}</div>`;buildNav()}
else $("#fb").innerHTML=`<div class="fb no">😜 Oops, try again! Hint: ${l.q[3]}</div>`});
wire();
buildNav();window.scrollTo(0,0)}
show();
</script>
